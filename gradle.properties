# Gradle performance tuning
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# R class
android.nonTransitiveRClass=true

# Disable AGP 9's built-in Kotlin so external KSP + Kotlin 2.3.0 can be used.
# TODO: Migrate to built-in Kotlin before AGP 10 (these flags will be removed).
#       See https://kotl.in/gradle/agp-built-in-kotlin
android.builtInKotlin=false
# Use legacy DSL so the external kotlin-android plugin can cast to BaseExtension.
android.newDsl=false


# AGP 9 enforces unique namespaces across all libraries.
# TensorFlow Lite artifacts (tensorflow-lite + tensorflow-lite-api) share the
# same namespace, which is a bug in the TF Lite packaging.
# Disable this check until upstream fixes the duplicate namespaces.
android.uniqueNamespaceEnforcement=false
android.enableDuplicateNamespaceCheck=false
